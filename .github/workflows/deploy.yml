name: Build and Push OCI Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: oci-agent
  REPO_PATH: agents/oci-agent
  REGISTRY_HOST: ocir.sa-saopaulo-1.oci.oraclecloud.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to OCIR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Tag Docker image
        run: |
          docker tag $IMAGE_NAME:${{ github.sha }} \
          $REGISTRY_HOST/${{ secrets.OCI_TENANCY_NAMESPACE }}/$REPO_PATH:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
          $REGISTRY_HOST/${{ secrets.OCI_TENANCY_NAMESPACE }}/$REPO_PATH:${{ github.sha }}
